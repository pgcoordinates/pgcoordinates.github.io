<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Payment Addresses</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }
    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #38bdf8;
      font-size: 1.8em;
    }
    .address-card {
      background: #334155;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid #475569;
    }
    .address-title {
      display: flex;
      align-items: center;
      font-weight: 700;
      color: #e2e8f0;
      font-size: 1.1em;
      margin-bottom: 8px;
    }
    .address-title img {
      margin-right: 10px;
      width: 28px;
      height: 28px;
    }
    .supported-tokens {
      color: #94a3b8;
      font-size: 0.85em;
      margin-bottom: 12px;
      padding-left: 38px;
    }
    .address-value {
      margin-top: 10px;
      font-family: monospace;
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      word-break: break-all;
      font-size: 0.9em;
      color: #cbd5e1;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 0.85em;
      flex: 1;
    }
    button:hover {
      background: #0ea5e9;
      transform: translateY(-1px);
    }
    button.track-btn {
      background: #10b981;
      color: white;
    }
    button.track-btn:hover {
      background: #059669;
    }
    button i {
      margin-right: 4px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
    .error {
      text-align: center;
      padding: 20px;
      color: #ef4444;
      background: #7f1d1d;
      border-radius: 8px;
      margin: 20px 0;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.9em;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-wallet"></i> Pay with Crypto</h1>

    <div id="addresses-container">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading addresses...
      </div>
    </div>

    <footer>
      Thank you for your payment and support.
    </footer>
  </div>

  <script>
    // Fetch and display crypto addresses
    async function loadAddresses() {
      const container = document.getElementById('addresses-container');

      try {
        const response = await fetch('crypto.json');
        if (!response.ok) {
          throw new Error('Failed to load addresses');
        }

        const data = await response.json();
        container.innerHTML = '';

        // Generate address cards
        data.networks.forEach(network => {
          const card = createAddressCard(network);
          container.appendChild(card);
        });

      } catch (error) {
        console.error('Error loading addresses:', error);
        container.innerHTML = `
          <div class="error">
            <i class="fa-solid fa-circle-exclamation"></i>
            Failed to load crypto addresses. Please try again later.
          </div>
        `;
      }
    }

    // Create an address card element
    function createAddressCard(network) {
      const card = document.createElement('div');
      card.className = 'address-card';

      const tokensText = network.supportedTokens.map(token => `<strong>${token}</strong>`).join(', ');
      const fullTrackUrl = network.trackUrl + network.address + (network.suffix || '');

      card.innerHTML = `
        <div class="address-title">
          <img src="${network.icon}" alt="${network.iconAlt}"> ${network.name}
        </div>
        <div class="supported-tokens">Supported tokens: ${tokensText}</div>
        <div class="address-value">${network.address}</div>
        <div class="button-group">
          <button onclick="copyAddress(this)">
            <i class="fa-solid fa-copy"></i>Copy
          </button>
          <button class="track-btn" onclick="trackTransaction('${fullTrackUrl}')">
            <i class="fa-solid fa-magnifying-glass"></i>Track
          </button>
        </div>
      `;

      return card;
    }

    // Copy address to clipboard
    function copyAddress(button) {
      const addressValue = button.closest('.address-card').querySelector('.address-value').textContent.trim();
      navigator.clipboard.writeText(addressValue);
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="fa-solid fa-check"></i>Copied!';
      setTimeout(() => button.innerHTML = originalHTML, 1500);
    }

    // Open transaction tracker in new tab
    function trackTransaction(url) {
      window.open(url, '_blank');
    }

    // Load addresses when page loads
    document.addEventListener('DOMContentLoaded', loadAddresses);
  </script>
</body>
</html>
